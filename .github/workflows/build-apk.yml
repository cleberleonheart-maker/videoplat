name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        working-directory: apps/mobile
        run: npm ci || npm install

      - name: Sync Capacitor (patch do plugin + cap sync)
        working-directory: apps/mobile
        run: npm run sync

      - name: Restaurar keystore
        working-directory: apps/mobile
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > android/keystore/videoplat-upload.jks

      - name: Compilar APK release
        working-directory: apps/mobile/android
        env:
          VPLAT_STORE_PASSWORD: ${{ secrets.VPLAT_STORE_PASSWORD }}
          VPLAT_KEY_ALIAS: ${{ secrets.VPLAT_KEY_ALIAS }}
          VPLAT_KEY_PASSWORD: ${{ secrets.VPLAT_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PVPLAT_STORE_PASSWORD="$VPLAT_STORE_PASSWORD" \
            -PVPLAT_KEY_ALIAS="$VPLAT_KEY_ALIAS" \
            -PVPLAT_KEY_PASSWORD="$VPLAT_KEY_PASSWORD"

      - name: Ler versao
        id: ver
        working-directory: apps/mobile/android
        run: echo "version=$(grep -oP 'versionName "\K[^"]+' app/build.gradle)" >> "$GITHUB_OUTPUT"

      - name: Publicar release
        working-directory: apps/mobile/android/app/build/outputs/apk/release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app-release.apk CameraVideoPlat-release.apk
          TAG="v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" CameraVideoPlat-release.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" CameraVideoPlat-release.apk --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" --notes "Build automatico (CI) da versao ${{ steps.ver.outputs.version }}."
          fi

      - name: Guardar APK como artifact
        uses: actions/upload-artifact@v4
        with:
          name: CameraVideoPlat-release-${{ steps.ver.outputs.version }}
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
