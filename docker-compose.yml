name: videoplat

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videoplat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videoplat}
      POSTGRES_DB: ${POSTGRES_DB:-videoplat}
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-videoplat}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # BullMQ usa chaves de lock; AOF evita perder fila em restart.
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      # Sem alias do mc dentro do container; o endpoint de liveness do
      # MinIO já garante que o servidor está aceitando conexões.
      test: ['CMD', 'curl', '-fsS', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 10

  # Cria os dois buckets (mídia processada e fontes privadas) e deixa
  # a mídia pública para leitura anônima.
  minio-init:
    build:
      context: .
      dockerfile: infra/minio/Dockerfile
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin} &&
      mc mb -p local/${S3_BUCKET:-videoplat} &&
      mc mb -p local/${S3_BUCKET:-videoplat}-source &&
      mc anonymous set download local/${S3_BUCKET:-videoplat}
      "

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      # Dentro da rede Docker os serviços são acessíveis pelos nomes
      # dos containers; sobrescreve os localhost do .env de host.
      DATABASE_URL: postgresql://${POSTGRES_USER:-videoplat}:${POSTGRES_PASSWORD:-videoplat}@postgres:5432/${POSTGRES_DB:-videoplat}?schema=public
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    ports:
      - '4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "npx prisma db push --skip-generate --schema apps/api/prisma/schema.prisma &&
             node apps/api/dist/main.js"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: '4'
          # Host tem 2,7GB de RAM; limite menor faz o cgroup matar só o
          # worker (reinicia sozinho) em vez de derrubar o dockerd.
          memory: 2G

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      # URL interna para SSR; a pública é usada apenas no browser.
      API_URL_INTERNAL: http://api:4000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
      NEXT_PUBLIC_MEDIA_URL: ${PUBLIC_MEDIA_URL:-http://localhost:9000/videoplat}
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
  minio-data:
