<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Câmera VideoPlat</title>
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <div id="app"></div>
    <noscript>Habilite o JavaScript para usar a câmera.</noscript>
    <script>
      function showErr(msg) {
        var d = document.getElementById('app');
        if (!d) return;
        d.innerHTML =
          '<div style="color:#ff6b6b;font-family:sans-serif;padding:24px;font-size:15px;line-height:1.5">' +
          '<b>Falha ao iniciar</b><br>' + String(msg).replace(/</g, '&lt;') +
          '<br><br><button style="font-size:15px;padding:8px 16px" onclick="location.reload()">Recarregar</button></div>';
      }
      window.addEventListener('error', function (e) {
        showErr(e.message || e.error || 'erro desconhecido');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e.reason;
        showErr((r && (r.message || r)) || 'promise rejeitada');
      });
    </script>
    <script src="app.js"></script>
  </body>
</html>
